name: Model Retraining

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron cannot express an exact 15-day interval.
    # Run on the 1st and 16th of every month as a predictable ~15-day cadence.
    - cron: "30 20 1,16 * *"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models
        run: python model_training.py

      - name: Commit updated model metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "No model artifacts or metrics changed."
          else
            git commit -m "Retrain ML models on 15-day cadence"
            git push
          fi
