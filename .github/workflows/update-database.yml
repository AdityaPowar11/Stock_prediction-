name: Daily Market and News Update

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-news-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install daily pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 yfinance==0.2.61 textblob==0.19.0 newspaper3k==0.2.8 nltk==3.9.1 beautifulsoup4==4.13.4 lxml==5.4.0 lxml_html_clean==0.4.2 requests==2.32.3
      - name: Update market and news database
        run: python daily_update.py
      - name: Show database status
        run: |
          python - <<'PY'
          from database import load_market_data, load_latest_news, get_connection
          market = load_market_data()
          news = load_latest_news()
          with get_connection() as conn:
              row = conn.execute("SELECT key, value FROM app_metadata ORDER BY key").fetchall()
          print(f"Market rows: {len(market)}")
          print(f"Latest market date: {market['Date'].max() if not market.empty else 'NONE'}")
          print(f"News rows: {len(news)}")
          print("Metadata:", dict(row))
          PY
      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_prediction.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: update daily market and news database"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
