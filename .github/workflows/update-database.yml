name: Update market database

on:
  schedule:
    # 17:00 IST = 11:30 UTC, Monday-Friday
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance textblob newspaper3k nltk beautifulsoup4 lxml requests

      - name: Update SQLite database
        run: |
          python -c "from stock_prediction import update_database; update_database()"

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_prediction.db
          git diff --cached --quiet || git commit -m "chore: update market and news database"
          git push
