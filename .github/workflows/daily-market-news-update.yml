name: Daily Market & News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch NIFTY 50 market data and news
        run: python -c "from stock_prediction import update_database; market, news = update_database(); print(f'Market rows: {len(market)}; News rows: {len(news)}')"
      - name: Persist updated SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_prediction.db
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update daily NIFTY 50 market and news data"
            git push
          fi
