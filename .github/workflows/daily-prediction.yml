name: Daily prediction

on:
  schedule:
    # 18:00 IST = 12:30 UTC, Monday-Friday
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib tensorflow yfinance textblob newspaper3k nltk beautifulsoup4 lxml requests
      - name: Create initial model if needed
        run: |
          if [ ! -f models/best_model.keras ]; then
            python model_training.py
          fi
      - name: Generate daily prediction
        run: python daily_prediction.py
      - name: Commit prediction and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_prediction.db models
          git diff --cached --quiet || git commit -m "chore: record daily prediction"
          git push
